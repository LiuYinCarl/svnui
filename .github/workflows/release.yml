name: Release

# Tag-based releases: pushing a tag like `v0.1.0` builds release binaries
# on Linux / macOS / Windows and creates a GitHub Release with them.
# No bot account involved — the release is created by this workflow using
# the repository's own GITHUB_TOKEN (permissions: contents: write).
#
# This workflow is also reusable (workflow_call): bump.yml calls it with an
# explicit `tag` input after auto-bumping the version, because tag pushes
# made with GITHUB_TOKEN do not trigger `on: push: tags` workflows.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # For the push trigger inputs.tag is empty and we fall back to the
  # pushed tag name; for workflow_call it is the tag passed by the caller.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify tag vs Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Tag version must match Cargo.toml version
        run: |
          VERSION="${TAG#v}"
          CRATE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "tag=$TAG version=$VERSION crate=$CRATE_VERSION"
          if [ "$VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::tag '${TAG}' does not match Cargo.toml version '${CRATE_VERSION}'"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: svnui
            name: svnui-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: svnui
            name: svnui-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: svnui.exe
            name: svnui-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: cargo build --release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage binary with target-specific name
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.name }}"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      - name: Create release with binaries
        uses: softprops/action-gh-release@v3
        with:
          # Without this, action-gh-release infers the tag from github.ref,
          # which is the caller's branch when invoked via workflow_call.
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
