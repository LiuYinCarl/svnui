name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    name: Clippy (no warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install svn (needed by integration tests)
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: cargo clippy (all targets, warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: "-D warnings"
      # brew on the macOS runner warns about tap trust; the repo's own
      # GITHUB_TOKEN flow doesn't need it, and this silences the notice
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install svn
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y subversion
          else
            brew install subversion
          fi
        shell: bash
      - name: cargo test
        run: cargo test --all-targets

  coverage:
    name: Coverage (>= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install svn
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: cargo llvm-cov (threshold 80%)
        run: cargo llvm-cov --fail-under-lines 80

  perf:
    name: Benchmarks (criterion, quick)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo bench (quick)
        run: cargo bench --bench tree -- --quick

  # Headless stress test against a LIVE open-source repo (rotating by run
  # number): clone shallow, convert git -> svn with git2svn, drive the app
  # headlessly. Catches bugs that only real-world histories expose (odd
  # file names, symlinks, merges). The exact source commit is logged so a
  # failure can be reproduced.
  stress:
    name: Stress (live repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install svn
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: Clone git2svn and build it
        run: |
          git clone -q --depth 1 https://github.com/LiuYinCarl/git2svn target/tmp/git2svn
          (cd target/tmp/git2svn && go build -o git2svn .)
      - name: Pick and convert a rotating open-source repo
        run: |
          repos=(
            "https://github.com/redis/redis"
            "https://github.com/clap-rs/clap"
            "https://github.com/sindresorhus/slugify"
          )
          repo="${repos[$((GITHUB_RUN_NUMBER % ${#repos[@]}))]}"
          echo "stress source: $repo"
          GIT2SVN_DIR="$PWD/target/tmp/git2svn" \
          STRESS_GIT_URL="$repo" \
          SVNUI_STRESS_ROUNDS=60 \
            scripts/stress_test.sh
        shell: bash

  build:
    name: Release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: "-D warnings"
      # brew on the macOS runner warns about tap trust; the repo's own
      # GITHUB_TOKEN flow doesn't need it, and this silences the notice
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release --locked
