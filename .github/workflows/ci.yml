name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    name: Clippy (no warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install svn (needed by integration tests)
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: cargo clippy (all targets, warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: "-D warnings"
      # brew on the macOS runner warns about tap trust; the repo's own
      # GITHUB_TOKEN flow doesn't need it, and this silences the notice
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install svn
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y subversion
          else
            brew install subversion
          fi
        shell: bash
      - name: cargo test
        run: cargo test --all-targets

  coverage:
    name: Coverage (>= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install svn
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: cargo llvm-cov (threshold 80%)
        run: cargo llvm-cov --fail-under-lines 80

  perf:
    name: Benchmarks (criterion, quick)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo bench (quick)
        run: cargo bench --bench tree -- --quick

  # Headless stress test against LIVE open-source repos (one per language,
  # all in parallel): clone shallow, convert git -> svn with git2svn, drive
  # the app headlessly. Catches bugs that only real-world histories expose
  # (odd file names, symlinks, merges). The exact source commit is logged
  # so a failure can be reproduced. Each leg is capped at 15 minutes; a
  # typical leg takes ~3.
  stress:
    name: Stress (${{ matrix.name }}, ${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: redis, lang: C, url: https://github.com/redis/redis }
          - { name: clap, lang: Rust, url: https://github.com/clap-rs/clap }
          - { name: slugify, lang: JS, url: https://github.com/sindresorhus/slugify }
          - { name: requests, lang: Python, url: https://github.com/psf/requests }
          - { name: gin, lang: Go, url: https://github.com/gin-gonic/gin }
          - { name: json, lang: C++, url: https://github.com/nlohmann/json }
          - { name: gson, lang: Java, url: https://github.com/google/gson }
          - { name: ohmyzsh, lang: Shell, url: https://github.com/ohmyzsh/ohmyzsh }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install svn
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: Clone git2svn and build it
        run: |
          # keep it out of target/, which rust-cache restores (a stale copy
          # from a previous run would make git clone fail)
          git clone -q --depth 1 https://github.com/LiuYinCarl/git2svn "$RUNNER_TEMP/git2svn"
          (cd "$RUNNER_TEMP/git2svn" && go build -o git2svn .)
      - name: Convert and stress
        run: |
          GIT2SVN_DIR="$RUNNER_TEMP/git2svn" \
          STRESS_GIT_URL="${{ matrix.url }}" \
          SVNUI_STRESS_ROUNDS=60 \
            scripts/stress_test.sh
        shell: bash

  build:
    name: Release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: "-D warnings"
      # brew on the macOS runner warns about tap trust; the repo's own
      # GITHUB_TOKEN flow doesn't need it, and this silences the notice
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release --locked
